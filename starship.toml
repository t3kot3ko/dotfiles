# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = false
format = '$character$directory$git_branch'
right_format = '$character$directory$git_branch$all'

# Replace the '❯' symbol in the prompt with '➜'
[character] # The name of the module we are configuring is 'character'
success_symbol = '[➜](bold green)' 
error_symbol = '[➜](bold red)' 

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

[line_break]
disabled = true

[git_branch]
symbol = '🌱 '
# truncation_length = 4
truncation_symbol = ''

[directory]
truncation_length = 1

[python]
disabled = true  # Enable only in Python projects via directory override
symbol = '👾 '
pyenv_version_name = true

# Performance optimization: disable heavy modules by default
[nodejs]
disabled = true  # Enable only in Node.js projects

[ruby]
disabled = true

[rust]
disabled = true

[golang]
disabled = true

[java]
disabled = true
