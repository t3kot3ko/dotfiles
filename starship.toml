# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = false
format = '$character$directory$git_branch'
# 右プロンプト（フルパス）は .zshrc で RPROMPT='[%~]' として zsh 側で表示する

# Replace the '❯' symbol in the prompt with '➜'
[character] # The name of the module we are configuring is 'character'
success_symbol = '[➜](bold green)' 
error_symbol = '[➜](bold red)' 

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

[line_break]
disabled = true

[git_branch]
symbol = ' '  # nf-oct-git_branch（starship の nerd-font-symbols プリセットと同じ）
# truncation_length = 4
truncation_symbol = ''

[directory]
truncation_length = 1

# 言語モジュールは該当ファイル（pyproject.toml, package.json 等）があるディレクトリでしか表示されないが、
# 表示する際に asdf のシム経由でバージョン確認コマンドを実行して遅くなるため、まとめて無効化している
[python]
disabled = true
symbol = ' '  # nf-fa-python（同上）
pyenv_version_name = true

[nodejs]
disabled = true

[ruby]
disabled = true

[rust]
disabled = true

[golang]
disabled = true

[java]
disabled = true
